<!DOCTYPE html> 
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"> 
<body> 
<header th:fragment="header" class="header"> 
    <div class="brand">IOTSTAR SHOP</div> 
    <nav> 
        <a th:href="@{/}">Trang chủ</a> 
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/users}">User</a> 
        <a sec:authorize="isAuthenticated()" th:href="@{/products}">Sản phẩm</a> 
    </nav> 
    <div class="account"> 
        <div sec:authorize="isAnonymous()"> 
            <a th:href="@{/login}">Đăng nhập</a> 
            <a th:href="@{/register}">Đăng ký</a> 
        </div> 
        <div sec:authorize="isAuthenticated()"> 
            Xin chào, <b sec:authentication="name"></b> 
            <form th:action="@{/logout}" method="post" style="display:inline"> 
                <button class="link-button">Đăng xuất</button> 
            </form> 
        </div> 
    </div> 
</header> 
</body> 
</html>
